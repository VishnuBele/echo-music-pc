name: Cross-platform build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish Windows x64 app
        run: dotnet publish EchoMusic.csproj -c Release -r win-x64 -p:BuildWindows=true --self-contained true -p:DebugType=None -p:DebugSymbols=false -o artifacts/windows-x64
      - uses: actions/upload-artifact@v4
        with:
          name: EchoMusic-Windows-x64-build
          path: artifacts/windows-x64/

  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish Linux x64 app
        run: dotnet publish EchoMusic.csproj -c Release -r linux-x64 --self-contained true -p:DebugType=None -p:DebugSymbols=false -o artifacts/linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: EchoMusic-Linux-x64-build
          path: artifacts/linux-x64/
